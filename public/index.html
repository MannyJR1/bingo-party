<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-time Bingo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4 font-sans">

  <!-- ==================== หน้าสร้างห้อง (แสดงเป็นค่าเริ่มต้น) ==================== -->
  <div id="host-setup-card" class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-md space-y-6">
    <h1 class="text-3xl font-black text-center text-amber-400 tracking-wider">🎯 BINGO REALTIME</h1>

    <div class="bg-slate-800/60 p-5 rounded-xl space-y-4 border border-slate-700">
      <h2 class="font-bold text-emerald-400 text-lg">สำหรับผู้สร้างห้อง (Host)</h2>
      <label class="block text-xs text-slate-400 leading-relaxed">
        ใส่ชุดคำคั่นด้วยจุลภาค (,) หรือเว้นว่างไว้เพื่อใช้เลข 1-75 (ต้องมี 24 คำขึ้นไป):
      </label>
      <textarea id="customItemsInput" rows="4" placeholder="เว้นว่างไว้ = ใช้เลข 1-75 อัตโนมัติ" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-xs focus:ring-1 focus:ring-emerald-400 outline-none text-slate-200"></textarea>
      <button onclick="createHost()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold transition text-base shadow-lg shadow-emerald-900/30">
        สร้างห้องใหม่
      </button>
    </div>

    <!-- ลิงก์สำหรับคนที่ต้องการพิมพ์ Code เข้าเล่นเอง -->
    <div class="text-center pt-2">
      <button onclick="switchView('manual-join')" class="text-xs text-slate-400 hover:text-amber-400 underline transition">
        มีรหัสห้องอยู่แล้ว? คลิกที่นี่เพื่อเข้าร่วมห้อง
      </button>
    </div>
  </div>

  <!-- ==================== หน้าสำหรับคนสแกน QR (ใส่แค่ชื่อ) ==================== -->
  <div id="qr-join-card" class="hidden bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-md space-y-6 text-center">
    <h1 class="text-3xl font-black text-amber-400 tracking-wider">🎯 BINGO REALTIME</h1>
    
    <div class="bg-slate-800/60 p-5 rounded-xl space-y-4 border border-slate-700">
      <p class="text-xs text-slate-400 uppercase tracking-widest">กำลังเข้าร่วมห้อง</p>
      <p id="qr-room-badge" class="text-3xl font-black text-indigo-400 font-mono tracking-wider">-</p>
      
      <input id="qrPlayerName" type="text" placeholder="ใส่ชื่อของคุณ" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-sm text-center outline-none focus:border-indigo-500 text-white">
      <button onclick="joinViaQR()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold transition text-sm shadow-lg shadow-indigo-900/30">
        เข้าเล่นเกม
      </button>
    </div>
  </div>

  <!-- ==================== หน้าเข้าห้องแบบพิมพ์รหัสเอง ==================== -->
  <div id="manual-join-card" class="hidden bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-md space-y-6">
    <h1 class="text-3xl font-black text-center text-amber-400 tracking-wider">🎯 BINGO REALTIME</h1>

    <div class="bg-slate-800/60 p-5 rounded-xl space-y-4 border border-slate-700">
      <h2 class="font-bold text-indigo-400 text-lg text-center">เข้าร่วมห้อง</h2>
      <input id="manualPlayerName" type="text" placeholder="ใส่ชื่อของคุณ" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-sm text-center outline-none focus:border-indigo-500">
      <input id="manualRoomId" type="text" placeholder="รหัสห้อง 4 ตัว" class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-sm text-center uppercase tracking-widest outline-none focus:border-indigo-500">
      <button onclick="joinManual()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-bold transition text-sm shadow-lg shadow-indigo-900/30">
        เข้าร่วมห้อง
      </button>
    </div>

    <div class="text-center pt-2">
      <button onclick="switchView('host-setup')" class="text-xs text-slate-400 hover:text-emerald-400 underline transition">
        กลับไปหน้าสร้างห้อง
      </button>
    </div>
  </div>

  <!-- ==================== จอแสดงผล Host ==================== -->
  <div id="host-view" class="hidden bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-4xl space-y-6">
    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <p class="text-xs text-slate-400 uppercase tracking-wider">Room Code</p>
        <p id="host-room-code" class="text-5xl font-black text-amber-400 tracking-widest"></p>
      </div>
      <div id="qrcode" class="p-2 bg-white rounded-xl shadow"></div>
    </div>

    <div class="text-center py-6 bg-slate-800/40 rounded-2xl border border-slate-800">
      <p class="text-xs text-slate-400 uppercase">ค่าที่ Call ล่าสุด</p>
      <div id="host-latest" class="text-5xl sm:text-6xl font-black text-emerald-400 my-4 break-words px-4">-</div>
      <button onclick="drawItem()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-8 py-3 rounded-xl font-black text-lg shadow-lg transition active:scale-95">
        🎲 สุ่มตัวถัดไป (Call)
      </button>
    </div>

    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
      <p class="text-xs text-slate-400 mb-2">ประวัติที่ออกไปแล้ว:</p>
      <div id="host-history" class="flex flex-wrap gap-2 max-h-40 overflow-y-auto text-xs"></div>
    </div>

    <div class="text-xs text-slate-400">
      ผู้เล่นทั้งหมด (<span id="player-count">0</span> คน): <span id="player-list" class="text-slate-200"></span>
    </div>
  </div>

  <!-- ==================== จอแสดงผล Player ==================== -->
  <div id="player-view" class="hidden bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-2xl w-full max-w-md space-y-4">
    <div class="flex justify-between items-center border-b border-slate-800 pb-3">
      <div>
        <span id="player-name-disp" class="font-bold text-amber-400 text-lg"></span>
        <span id="player-room-disp" class="ml-2 text-xs bg-slate-800 px-2 py-1 rounded text-slate-400 font-mono"></span>
      </div>
      <label class="flex items-center gap-2 cursor-pointer select-none">
        <span class="text-xs text-slate-300 font-medium">Auto:</span>
        <input type="checkbox" id="autoToggle" class="sr-only peer" onchange="toggleAuto(this.checked)">
        <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-500"></div>
      </label>
    </div>

    <div class="bg-slate-800/70 p-3 rounded-xl border border-slate-700 text-center">
      <p class="text-xs text-slate-400">Call ล่าสุดที่ออก:</p>
      <p id="player-latest" class="text-2xl font-black text-emerald-400 truncate mt-0.5">-</p>
    </div>

    <div id="bingo-grid" class="grid grid-cols-5 gap-1.5 aspect-square"></div>
  </div>

  <script>
    const socket = io();
    let currentRoom = '';
    let currentDrawn = [];

    // ตรวจสอบทันทีตอนเปิดหน้าเว็บว่ามี ?room=XXXX ติดมากับลิงก์หรือไม่ (จากการสแกน QR)
    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');

      if (roomParam) {
        currentRoom = roomParam.toUpperCase();
        document.getElementById('qr-room-badge').innerText = currentRoom;
        switchView('qr-join');
      } else {
        switchView('host-setup');
      }
    };

    function switchView(viewName) {
      document.getElementById('host-setup-card').classList.add('hidden');
      document.getElementById('qr-join-card').classList.add('hidden');
      document.getElementById('manual-join-card').classList.add('hidden');

      if (viewName === 'host-setup') document.getElementById('host-setup-card').classList.remove('hidden');
      if (viewName === 'qr-join') document.getElementById('qr-join-card').classList.remove('hidden');
      if (viewName === 'manual-join') document.getElementById('manual-join-card').classList.remove('hidden');
    }

    // Host สร้างห้อง
    function createHost() {
      const text = document.getElementById('customItemsInput').value.trim();
      let customItems = null;
      if (text) {
        customItems = text.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
        if (customItems.length < 24) {
          return alert('ต้องมีคำอย่างน้อย 24 คำขึ้นไป (ตอนนี้มี ' + customItems.length + ' คำ)');
        }
      }
      socket.emit('create-room', { customItems });
    }

    socket.on('room-created', ({ roomId }) => {
      currentRoom = roomId;
      hideAllSetupCards();
      document.getElementById('host-view').classList.remove('hidden');
      document.getElementById('host-room-code').innerText = roomId;

      // ลิงก์ที่สร้างใน QR จะมี ?room=XXXX แนบไปเสมอ
      new QRCode(document.getElementById('qrcode'), {
        text: `${window.location.origin}?room=${roomId}`,
        width: 100,
        height: 100
      });
    });

    // Player เข้าร่วมผ่าน QR (กรอกแค่ชื่อ)
    function joinViaQR() {
      const name = document.getElementById('qrPlayerName').value.trim();
      if (!name) return alert('กรุณากรอกชื่อของคุณ');
      socket.emit('join-room', { roomId: currentRoom, name });
    }

    // Player เข้าร่วมแบบกรอกรหัสเอง
    function joinManual() {
      const name = document.getElementById('manualPlayerName').value.trim();
      const roomId = document.getElementById('manualRoomId').value.trim();
      if (!name || !roomId) return alert('กรุณากรอกชื่อและรหัสห้องให้ครบถ้วน');
      currentRoom = roomId.toUpperCase();
      socket.emit('join-room', { roomId: currentRoom, name });
    }

    socket.on('joined-success', ({ roomId, card, drawnItems }) => {
      currentRoom = roomId;
      currentDrawn = drawnItems;
      hideAllSetupCards();
      document.getElementById('player-view').classList.remove('hidden');
      
      const enteredName = document.getElementById('qrPlayerName').value || document.getElementById('manualPlayerName').value;
      document.getElementById('player-name-disp').innerText = enteredName;
      document.getElementById('player-room-disp').innerText = roomId;

      if (drawnItems.length > 0) {
        document.getElementById('player-latest').innerText = drawnItems[drawnItems.length - 1];
      }
      renderCard(card);
    });

    function hideAllSetupCards() {
      document.getElementById('host-setup-card').classList.add('hidden');
      document.getElementById('qr-join-card').classList.add('hidden');
      document.getElementById('manual-join-card').classList.add('hidden');
    }

    function drawItem() {
      socket.emit('draw-item', currentRoom);
    }

    function toggleAuto(enabled) {
      socket.emit('toggle-auto', { roomId: currentRoom, enabled });
    }

    socket.on('item-drawn', ({ drawn, history }) => {
      currentDrawn = history;

      const hLatest = document.getElementById('host-latest');
      if (hLatest) hLatest.innerText = drawn;
      const hHistory = document.getElementById('host-history');
      if (hHistory) {
        hHistory.innerHTML = history.map(item => `
          <span class="bg-slate-800 border border-slate-700 px-2 py-1 rounded text-slate-200 font-medium">${item}</span>
        `).join('');
      }

      const pLatest = document.getElementById('player-latest');
      if (pLatest) pLatest.innerText = drawn;

      if (window.lastCard) renderCard(window.lastCard);
    });

    socket.on('card-updated', (card) => renderCard(card));

    function renderCard(grid) {
      window.lastCard = grid;
      const container = document.getElementById('bingo-grid');
      container.innerHTML = '';

      grid.forEach((row, r) => {
        row.forEach((cell, c) => {
          const btn = document.createElement('button');
          const isDrawn = currentDrawn.includes(cell.val) || cell.val === 'FREE';
          
          let style = 'border text-xs sm:text-sm font-bold rounded-xl flex items-center justify-center p-1 text-center break-words transition-all ';

          if (cell.marked) {
            style += 'bg-emerald-600 border-emerald-400 text-white shadow-inner ';
          } else if (isDrawn) {
            style += 'bg-slate-700 hover:bg-slate-600 border-amber-400 text-amber-300 animate-pulse ';
          } else {
            style += 'bg-slate-800/80 border-slate-800 text-slate-500 cursor-not-allowed opacity-60 ';
          }

          btn.className = style;
          btn.innerText = cell.val;

          if (isDrawn) {
            btn.onclick = () => socket.emit('mark-cell', { roomId: currentRoom, r, c });
          }

          container.appendChild(btn);
        });
      });
    }

    socket.on('update-players', (names) => {
      const countEl = document.getElementById('player-count');
      const listEl = document.getElementById('player-list');
      if (countEl) countEl.innerText = names.length;
      if (listEl) listEl.innerText = names.join(', ');
    });

    socket.on('game-over', ({ winner }) => {
      alert(`🎉 BINGO! ผู้ชนะคือ: ${winner}`);
    });

    socket.on('error-msg', (msg) => alert(msg));
  </script>
</body>
</html>
